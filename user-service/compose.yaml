services:
  user-service:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-foc_user_service}:${RABBITMQ_PASSWORD:-foc-local-rabbitmq}@rabbitmq:5672/
    volumes:
      - ./secrets/development:/app/secrets/development:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready")
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.3
    ports:
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-foc_user_service}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-foc-local-rabbitmq}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
