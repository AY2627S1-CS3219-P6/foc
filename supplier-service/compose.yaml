services:
  supplier-service:
    build: .
    env_file: .env
    environment:
      SUPPLIER_DATABASE_URL: ${SUPPLIER_DATABASE_URL_DOCKER:-postgresql://postgres:postgres@host.docker.internal:55322/postgres}
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL_DOCKER:-http://user-service:8000}
    ports:
      - "${SUPPLIER_HOST_PORT:-8001}:8001"
    networks:
      - default
      - user-service-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/openapi.json")
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  user-service-internal:
    external: true
    name: ${USER_SERVICE_INTERNAL_NETWORK:-foc-user-service-internal}
