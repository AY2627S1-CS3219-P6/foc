name: foc-order-demo

x-order: &order
  build: ..
  environment: &order-env
    ENVIRONMENT: test
    DATABASE_URL: postgresql://order_demo_app:${DEMO_APP_PASSWORD:?Run setup.ps1}@database:5432/postgres
    USER_SERVICE_BASE_URL: http://host.docker.internal:8000
    SUPPLIER_SERVICE_BASE_URL: http://host.docker.internal:8001
    CREDIT_SERVICE_BASE_URL: http://credit-simulator:8010
    CREDIT_SERVICE_SECRET: ${DEMO_CREDIT_SECRET:?Run setup.ps1}
    RABBITMQ_URL: amqp://order_demo:${DEMO_BROKER_PASSWORD:?Run setup.ps1}@broker:5672/
    OUTBOX_EXCHANGE_NAME: foc.order-demo.events
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    provision:
      condition: service_completed_successfully
    credit-simulator:
      condition: service_healthy

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run setup.ps1}
    volumes:
      - order-data:/var/lib/postgresql/data
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../supabase/migrations/20261009000000_order_foundation.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../supabase/migrations/20261009000100_order_creation.sql:/docker-entrypoint-initdb.d/20-create.sql:ro
      - ../supabase/migrations/20261011000000_order_accept_cancel_expire.sql:/docker-entrypoint-initdb.d/30-lifecycle.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20
  provision:
    build: ..
    user: order_service
    command: [python, /demo/provision.py]
    environment:
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Run setup.ps1}
      APP_PASSWORD: ${DEMO_APP_PASSWORD:?Run setup.ps1}
    volumes:
      - ./provision.py:/demo/provision.py:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
  broker:
    image: rabbitmq:4.1
    environment:
      RABBITMQ_DEFAULT_USER: order_demo
      RABBITMQ_DEFAULT_PASS: ${DEMO_BROKER_PASSWORD:?Run setup.ps1}
    volumes:
      - broker-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  credit-simulator:
    build: .
    environment:
      CREDIT_SIMULATOR_ENABLED: local-only
      CREDIT_SERVICE_SECRET: ${DEMO_CREDIT_SECRET:?Run setup.ps1}
      RABBITMQ_URL: amqp://order_demo:${DEMO_BROKER_PASSWORD:?Run setup.ps1}@broker:5672/
      SIMULATOR_MODE: ${SIMULATOR_MODE:-success}
    volumes:
      - credit-simulation:/data
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health/ready")']
      interval: 3s
      timeout: 3s
      retries: 20
  order-service:
    <<: *order
    ports:
      - '127.0.0.1:18002:8002'
  order-recovery:
    <<: *order
    command: [order-recovery]
    healthcheck:
      disable: true
  order-expiry:
    <<: *order
    command: [order-expiry]
    healthcheck:
      disable: true
  order-outbox:
    <<: *order
    command: [order-outbox]
    healthcheck:
      disable: true
  website:
    build:
      context: ../../web-client
      args:
        VITE_ORDER_DEMO: 'true'
    ports:
      - '127.0.0.1:3001:80'
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      order-service:
        condition: service_healthy

volumes:
  order-data:
  broker-data:
  credit-simulation:
