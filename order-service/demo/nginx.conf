# LOCAL DEMO ONLY: existing host User/Supplier; isolated Order; no Credit/browser route.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ~ ^/v1/(orders|order-creations|admin/orders)(/|$) {
        set $order_upstream order-service:8002;
        proxy_pass http://$order_upstream$request_uri;
    }
    location /v1/ {
        proxy_pass http://host.docker.internal:8000;
    }
    location ~ ^/api/v1/(categories|suppliers|admin/suppliers)(/|$) {
        set $supplier_upstream host.docker.internal:8001;
        proxy_pass http://$supplier_upstream$request_uri;
    }
    location /api/v1/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
