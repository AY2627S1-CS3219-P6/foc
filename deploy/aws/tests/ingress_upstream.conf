# Disposable CI fixture. Never used by any application or deployment profile.
server {
    listen 8000;
    listen 8001;
    listen 8002;
    listen 8003;
    listen 8005;
    listen 8006;
    location = /v1/chat/live {
        add_header Upgrade websocket always;
        add_header Connection Upgrade always;
        add_header Sec-WebSocket-Accept s3pPLMBiTxaQ9kYGzzhZRbK+xOo= always;
        return 101;
    }
    location / {
        default_type application/json;
        add_header Set-Cookie "refresh=ingress-test; HttpOnly; Secure; SameSite=Lax" always;
        return 200 '{"authorization":"$http_authorization","cookie":"$http_cookie","origin":"$http_origin","uri":"$request_uri","proto":"$http_x_forwarded_proto"}';
    }
}
