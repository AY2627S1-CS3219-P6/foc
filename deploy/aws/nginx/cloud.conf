# Included inside the existing web-client server block. Route ownership stays shared.
server_tokens off;
access_log off;

location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
}

# Internal calls are service-to-service only, including User's generic /v1 routes.
location ^~ /v1/internal/ {
    return 404;
}

