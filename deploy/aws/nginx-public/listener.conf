# Included only by the public overlay, inside the existing shared server block.
# CloudFront redirects viewers to HTTPS; its origin leg uses HTTP on TCP 8080.
# The EC2 firewall must restrict this listener to CloudFront origin-facing IPs.
listen 8080;
if ($server_port = 8080) {
    set $foc_forwarded_proto https;
}
