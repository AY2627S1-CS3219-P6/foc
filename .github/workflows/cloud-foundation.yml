name: Cloud foundation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  configuration:
    name: Validate cloud configuration and ingress
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install deployment lint tool
        run: python -m pip install ruff==0.14.3 cfn-lint==1.60.0
      - name: Check deployment script style
        run: |
          ruff check --select E,F,I,UP,B --ignore E501 --target-version py311 deploy/aws/scripts deploy/aws/tests
          ruff format --check --line-length 100 deploy/aws/scripts deploy/aws/tests
      - name: Validate monitoring infrastructure and systemd units
        run: |
          cfn-lint deploy/aws/monitoring/stack.json
          systemd-analyze verify deploy/aws/systemd/foc-monitoring.service deploy/aws/systemd/foc-monitoring.timer
      - name: Check deployment helpers
        run: python -m unittest discover -s deploy/aws/tests -v
      - name: Validate GitHub workflow definitions
        run: |
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl --fail --silent --show-error --location "$url/$asset" -o "$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location "$url/actionlint_${version}_checksums.txt" -o "$RUNNER_TEMP/actionlint-checksums.txt"
          expected=$(awk -v asset="$asset" '$2 == asset {print $1}' "$RUNNER_TEMP/actionlint-checksums.txt")
          test -n "$expected"
          echo "$expected  $RUNNER_TEMP/$asset" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/cloud-foundation.yml .github/workflows/cloud-release.yml
      - name: Generate throwaway CI configuration
        run: python deploy/aws/scripts/generate_env.py
      - name: Render and validate all profiles without contacting AWS or databases
        run: python deploy/aws/scripts/validate.py
      - name: Check public configuration without creating AWS resources
        env:
          CLOUD_COMPOSE_SMOKE: "1"
        run: |
          python -m unittest discover -s deploy/aws/tests -p test_public_https.py -v
          python -m unittest discover -s deploy/aws/tests -p test_email_configuration.py -v
          python -m unittest discover -s deploy/aws/tests -p test_releases.py -v
          python deploy/aws/scripts/public_https.py distribution --origin-domain ec2-54-179-16-136.ap-southeast-1.compute.amazonaws.com
          python deploy/aws/scripts/public_https.py set-origin --origin https://dexample.cloudfront.net
          python deploy/aws/scripts/validate.py --public
      - name: Bootstrap one real Supabase project on this disposable runner
        run: python deploy/aws/scripts/prepare_databases.py --ec2-sandbox --service user
      - name: Verify the same project can resume without resetting data or secrets
        run: python deploy/aws/scripts/prepare_databases.py --ec2-sandbox --service user
      - name: Check restricted login and rotated database password over TCP
        env:
          CLOUD_DB_SMOKE: "1"
        run: python -m unittest discover -s deploy/aws/tests -p test_database_live.py -v
      - name: Verify monitoring reads real disposable Docker metadata without credentials
        env:
          CLOUD_MONITORING_SMOKE: "1"
        run: python -m unittest discover -s deploy/aws/tests -p test_monitoring.py -v
      - name: Check Nginx local, private and public configurations
        run: |
          docker run --rm \
            --mount type=bind,src="$PWD/web-client/nginx/default.conf",dst=/etc/nginx/conf.d/default.conf,readonly \
            --add-host user-service:127.0.0.1 \
            nginx:1.27-alpine nginx -t
          docker network create cloud-config-check
          docker run -d --name cloud-config-user --network cloud-config-check \
            --network-alias user-service --network-alias order-service \
            --network-alias credit-service --network-alias supplier-service \
            --network-alias chat-service --network-alias admin-service --network-alias voice-assist-service \
            --mount type=bind,src="$PWD/deploy/aws/tests/ingress_upstream.conf",dst=/etc/nginx/conf.d/default.conf,readonly \
            nginx:1.27-alpine
          docker run --rm --network cloud-config-check \
            --mount type=bind,src="$PWD/web-client/nginx/default.conf",dst=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,src="$PWD/deploy/aws/nginx",dst=/etc/nginx/foc,readonly \
            nginx:1.27-alpine nginx -t
          docker run -d --name cloud-config-proxy --network cloud-config-check \
            --mount type=bind,src="$PWD/web-client/nginx/default.conf",dst=/etc/nginx/conf.d/default.conf,readonly \
            --mount type=bind,src="$PWD/deploy/aws/nginx",dst=/etc/nginx/foc,readonly \
            --mount type=bind,src="$PWD/deploy/aws/nginx-public",dst=/etc/nginx/foc-public,readonly \
            nginx:1.27-alpine
          docker exec cloud-config-proxy nginx -t
      - name: Verify public/private routing, auth headers, cookies and Chat upgrade
        run: |
          docker run --rm --network cloud-config-check \
            --env CLOUD_INGRESS_SMOKE=1 \
            --mount type=bind,src="$PWD/deploy/aws/tests",dst=/checks,readonly \
            python:3.13-alpine python -m unittest discover -s /checks -p test_ingress_live.py -v
      - name: Remove configuration-check resources
        if: always()
        run: |
          docker rm -f cloud-config-user cloud-config-proxy || true
          docker network rm cloud-config-check || true

