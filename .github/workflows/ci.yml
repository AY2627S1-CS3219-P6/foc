name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Identify affected components
        id: filter
        # dorny/paths-filter@v3.0.4
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        with:
          filters: |
            web-client:
              - 'web-client/**'
            user-service:
              - 'user-service/**'

  validate:
    name: Validate ${{ matrix.service }}
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Check out repository
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        if: matrix.service == 'web-client'
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Install web client dependencies
        if: matrix.service == 'web-client'
        working-directory: web-client
        run: npm ci

      - name: Lint web client
        if: matrix.service == 'web-client'
        working-directory: web-client
        run: npm run lint

      - name: Run web client unit and component tests
        if: matrix.service == 'web-client'
        working-directory: web-client
        run: npm test

      - name: Install Chromium for browser tests
        if: matrix.service == 'web-client'
        working-directory: web-client
        run: npx playwright install --with-deps chromium

      - name: Run web client browser tests
        if: matrix.service == 'web-client'
        working-directory: web-client
        run: npm run test:e2e

      - name: Set up Python
        if: matrix.service == 'user-service'
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: user-service/pyproject.toml

      - name: Install user service dependencies
        if: matrix.service == 'user-service'
        working-directory: user-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint user service
        if: matrix.service == 'user-service'
        working-directory: user-service
        run: ruff check .

      - name: Run user service unit and ASGI tests
        if: matrix.service == 'user-service'
        working-directory: user-service
        run: pytest -m "not integration"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build ${{ matrix.service }} container image
        # docker/build-push-action@v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  ci-passed:
    name: CI passed
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not complete successfully: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$VALIDATE_RESULT" = "failure" ] || [ "$VALIDATE_RESULT" = "cancelled" ]; then
            echo "Component validation did not complete successfully: $VALIDATE_RESULT"
            exit 1
          fi
