[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foc-chat-service"
version = "0.1.0"
description = "FoC private text conversations"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1", "httpx>=0.28,<1", "aio-pika>=9.5,<10",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
chat-outbox = "app.outbox:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires isolated local Chat Service PostgreSQL", "broker: requires isolated local Chat Service RabbitMQ"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
