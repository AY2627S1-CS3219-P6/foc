server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /v1/ {
        # No trailing slash: Nginx preserves the complete original API URI.
        proxy_pass http://user-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(categories|suppliers|admin/suppliers)(/|$) {
        # Resolve at request time so the User-only Compose stack still starts.
        set $supplier_upstream supplier-service:8001;
        proxy_pass http://$supplier_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
