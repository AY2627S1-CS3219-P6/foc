map $http_upgrade $chat_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location ~ ^/v1/chat(/|$) {
        # Resolve only when requested so the optional Chat profile may be off.
        set $chat_upstream chat-service:8003;
        proxy_pass http://$chat_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chat_connection_upgrade;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver_timeout 5s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/v1/(orders|order-creations|admin/orders)(/|$) {
        # Optional Order profile may be stopped; resolve only when requested.
        set $order_upstream order-service:8002;
        proxy_pass http://$order_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v1/(wallets|admin/wallets)(/|$) {
        # Optional Credit profile may be stopped; resolve only when requested.
        # /v1/internal/* is never routed to Credit: only Order calls it, over the edge network.
        set $credit_upstream credit-service:8003;
        proxy_pass http://$credit_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/v1/(admin/disputes|admin/audit-log|disputes)(/|$) {
        # Optional Admin profile may be stopped; resolve only when requested.
        # Other /v1/admin/* paths stay with the services that own that data.
        set $admin_upstream admin-service:8005;
        proxy_pass http://$admin_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        # No trailing slash: Nginx preserves the complete original API URI.
        proxy_pass http://user-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(categories|suppliers|admin/suppliers)(/|$) {
        # Resolve at request time so the User-only Compose stack still starts.
        set $supplier_upstream supplier-service:8001;
        proxy_pass http://$supplier_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
